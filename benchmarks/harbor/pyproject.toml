[project]
name = "smith-harbor"
version = "0.1.1"
description = "Pinned Harbor evaluation bridge for Smith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.20.0",
  # Harbor permits newer LiteLLM releases, but 1.95.0 currently has no usable
  # macOS arm64 wheel and its source build requires Rust 1.94.1. This is the
  # newest-compatible pure-Python release tested by this project.
  "litellm==1.83.14",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
smith-harbor = "smith_harbor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smith_harbor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smith_harbor"]
exclude = ["smith_harbor/smith_agent.py"]
