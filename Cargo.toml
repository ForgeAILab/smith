[workspace]
resolver = "3"
members = [
    "crates/smith-config",
    "crates/smith-host",
    "crates/smith-runtime",
    "crates/smith-tools",
    "crates/smith-tui",
    "crates/smith-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smith-agent/smith"
authors = ["Smith contributors"]

[workspace.dependencies]
smith-config = { path = "crates/smith-config", version = "0.0.1" }
smith-host = { path = "crates/smith-host", version = "0.0.1" }
smith-runtime = { path = "crates/smith-runtime", version = "0.0.1" }
smith-tools = { path = "crates/smith-tools", version = "0.0.1" }
smith-tui = { path = "crates/smith-tui", version = "0.0.1" }

# The shared runtime. Smith depends on one immutable, reviewed runtime source
# revision. Local sibling-checkout development uses the git-ignored
# `.cargo/config.toml` patch table; committed manifests never rely on a
# developer-specific filesystem layout.
agent-runtime = { git = "https://github.com/mai1015/agent-runtime.git", rev = "50f230e4ca8ba318fd4c5c84df0876051c54d93e", version = "=0.1.0" }
agent-runtime-core = { git = "https://github.com/mai1015/agent-runtime.git", rev = "50f230e4ca8ba318fd4c5c84df0876051c54d93e", version = "=0.1.0" }
agent-runtime-registry = { git = "https://github.com/mai1015/agent-runtime.git", rev = "50f230e4ca8ba318fd4c5c84df0876051c54d93e", version = "=0.1.0" }
agent-runtime-testkit = { git = "https://github.com/mai1015/agent-runtime.git", rev = "50f230e4ca8ba318fd4c5c84df0876051c54d93e", version = "=0.1.0" }

anyhow = "1"
async-trait = "0.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-core = "0.3"
futures-util = "0.3"
ignore = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "sync-secret-service"] }
# `unstable-rendered-line-info` provides `Paragraph::line_count`, the only way
# to size scroll offsets and modal heights with the renderer's own word-wrap
# arithmetic instead of a drifting character-wrap estimate.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
# The production HTTP transport. `rustls` keeps the TLS stack in Rust so the
# workspace stays free of an OpenSSL build dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
