[workspace]
resolver = "3"
members = [
    "crates/smith-config",
    "crates/smith-host",
    "crates/smith-runtime",
    "crates/smith-tools",
    "crates/smith-tui",
    "crates/smith-cli",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ForgeAILab/smith"
authors = ["Smith contributors"]

[workspace.dependencies]
smith-config = { path = "crates/smith-config", version = "0.0.2" }
smith-host = { path = "crates/smith-host", version = "0.0.2" }
smith-runtime = { path = "crates/smith-runtime", version = "0.0.2" }
smith-tools = { path = "crates/smith-tools", version = "0.0.2" }
smith-tui = { path = "crates/smith-tui", version = "0.0.2" }

# The shared runtime. Smith depends on one immutable, reviewed runtime source
# revision. Local sibling-checkout development uses the git-ignored
# `.cargo/config.toml` patch table; committed manifests never rely on a
# developer-specific filesystem layout.
#
# The `version` requirements are what keep these off `deny.toml`'s
# `wildcards = "deny"` list; a git dependency without one is a wildcard. Note
# that `agent-runtime` on crates.io is an unrelated crate that publishes its
# own 0.1.0, so the `git`/`rev` keys -- not the version -- are what identify
# the dependency. Never relax them to a bare version requirement.
agent-runtime = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }
agent-runtime-ability = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }
agent-runtime-core = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }
# The MCP client. `smith-runtime` adds the `http` transport on top of the
# default `stdio` one; both land on the same `reqwest` Smith's own transport
# uses, which is why the `reqwest` requirement below tracks `rmcp`'s.
agent-runtime-mcp = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }
agent-runtime-registry = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }
agent-runtime-testkit = { git = "https://github.com/ForgeAILab/agent-runtime.git", rev = "e72390a63ba83c65d781ba701fb3552755a47f29", version = "=0.1.0" }

anyhow = "1"
# Clipboard image capture for composer attachments. `arboard` reads the
# platform clipboard; `image` encodes the RGBA pixels as PNG (the only codec
# compiled in); `base64` builds the provider-facing data URI.
arboard = "3"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
cap-std = "4.0.3"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
exacl = "0.13.0"
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "sync-secret-service", "vendored"] }
# `unstable-rendered-line-info` provides `Paragraph::line_count`, the only way
# to size scroll offsets and modal heights with the renderer's own word-wrap
# arithmetic instead of a drifting character-wrap estimate.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
# The production HTTP transport. `rustls` keeps the TLS stack in Rust so the
# workspace stays free of an OpenSSL build dependency.
#
# Pinned to the same major as `rmcp`'s (agent-runtime-mcp's MCP client) so the
# `http` MCP transport and Smith's provider transport share one client, one TLS
# stack, and one connection-pool implementation. Diverging here links two
# independent HTTP stacks into every binary; if `rmcp` moves, move with it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "charset", "form"] }
rustix = { version = "1.1", features = ["fs", "process"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
# `env-filter` reads the process log level from an environment variable
# (`smith-cli` maps `SMITH_LOG` onto it) without Smith having to parse
# directive syntax itself.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
xattr = "1.6.1"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
