[package]
name = "smith-host"
description = "Smith's host-policy layer over the shared agent runtime: interactive approval and the project workspace boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-runtime-core = { workspace = true }
agent-runtime-registry = { workspace = true }
async-trait = { workspace = true }
cap-std = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
xattr = { workspace = true }

# POSIX ACLs are `system.posix_acl_access` extended attributes on Linux, so the
# xattr preservation above already carries them and linking `libacl` would be
# redundant -- and impossible for the static musl artifacts, which have no musl
# build of it. macOS keeps its ACLs outside the xattr namespace and needs the
# real library.
[target.'cfg(target_os = "macos")'.dependencies]
exacl = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Tests assert ACL preservation on both platforms, including the Linux path
# that rides on xattrs, so they read ACLs directly even where the library is
# not linked into the shipped binary.
[target.'cfg(unix)'.dev-dependencies]
exacl = { workspace = true }
