[package]
name = "smith-cli"
description = "The `smith` binary: the interactive terminal client and non-interactive automation entry points."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "smith"
path = "src/main.rs"

[features]
default = ["module-image-generation", "module-budget-notice"]
module-image-generation = ["dep:smith-module-image-generation"]
module-budget-notice = ["dep:smith-module-budget-notice"]

[dependencies]
agent-runtime-core = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true }
image = { workspace = true }
chacha20poly1305 = { workspace = true }
futures-util = { workspace = true }
ignore = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smith-config = { workspace = true }
smith-client = { workspace = true }
smith-host = { workspace = true }
smith-runtime = { workspace = true }
smith-module = { workspace = true }
smith-module-image-generation = { workspace = true, optional = true }
smith-module-budget-notice = { workspace = true, optional = true }
smith-tools = { workspace = true }
smith-tui = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
smith-test-module = { workspace = true }
agent-runtime = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
