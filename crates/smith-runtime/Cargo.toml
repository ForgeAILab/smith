[package]
name = "smith-runtime"
description = "Smith's runtime composition: the production HTTP transport, session persistence, the canonical event journal, and the one factory every Smith host builds a runtime through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

