name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smith:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `clippy_warnings_only` marks the leg whose toolchain floats: it
          # reads new lints without letting a Rust release fail the build.
          - name: Linux · Rust 1.88
            os: ubuntu-24.04
            rust: 1.88.0
            dependency_policy: false
            clippy_warnings_only: false
          - name: macOS · Rust 1.88
            os: macos-14
            rust: 1.88.0
            dependency_policy: false
            clippy_warnings_only: false
          - name: Linux · stable + dependency policy
            os: ubuntu-24.04
            rust: stable
            dependency_policy: true
            clippy_warnings_only: true

    steps:
      - name: Check out Smith
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tui
          persist-credentials: false

      # Cargo.lock records the runtime source exactly as the build resolves
      # it, so the checkout target is read from there rather than from a
      # variable that has to be re-set on every runtime bump -- and that fails
      # confusingly against the wrong revision when someone forgets. There is
      # one source of truth and CI cannot disagree with it.
      - name: Resolve the pinned Agent Runtime source
        id: runtime
        shell: bash
        working-directory: tui
        run: |
          sources="$(grep -oE 'git\+https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\?rev=[0-9a-f]{40}' Cargo.lock | sort -u)"
          if [[ -z "${sources}" ]]; then
            echo "::error::Cargo.lock records no git-pinned Agent Runtime source."
            exit 2
          fi
          if [[ "$(wc -l <<<"${sources}")" -ne 1 ]]; then
            echo "::error::Cargo.lock pins more than one Agent Runtime revision:"
            echo "${sources}"
            exit 2
          fi
          repository="$(sed -E 's#^git\+https://github\.com/(.+)\?rev=.*$#\1#' <<<"${sources}")"
          repository="${repository%.git}"
          revision="$(sed -E 's#^.*\?rev=([0-9a-f]{40})$#\1#' <<<"${sources}")"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "Agent Runtime pinned to ${repository}@${revision}"

      - name: Check out Agent Runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.revision }}
          token: ${{ secrets.AGENT_RUNTIME_TOKEN || github.token }}
          path: agent-runtime
          persist-credentials: false

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config

      - name: Install Rust
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" \
            --profile minimal \
            --component clippy,rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      - name: Verify the runtime checkout
        working-directory: agent-runtime
        shell: bash
        env:
          RUNTIME_REVISION: ${{ steps.runtime.outputs.revision }}
        run: |
          actual_revision="$(git rev-parse HEAD)"
          test "${actual_revision}" = "${RUNTIME_REVISION}"
          test -z "$(git status --porcelain)"

      - name: Run Smith and shared conformance gates
        working-directory: tui
        shell: bash
        env:
          SMITH_AGENT_RUNTIME_REVISION: ${{ steps.runtime.outputs.revision }}
          SMITH_CI_CLIPPY_WARNINGS_ONLY: ${{ matrix.clippy_warnings_only }}
        run: bash scripts/ci.sh

      - name: Install cargo-deny
        if: matrix.dependency_policy
        working-directory: tui
        shell: bash
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans, and sources
        if: matrix.dependency_policy
        working-directory: tui
        shell: bash
        run: cargo deny --locked check all

  npm-bootstrapper:
    name: npm Bootstrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check npx-cli/bin/cli.js

      - name: Platform selection tests
        working-directory: npx-cli
        run: npm test

      - name: Installer rejects unavailable musl artifacts
        run: |
          if output="$(SMITH_LIBC=musl bash install.sh 2>&1)"; then
            echo "installer unexpectedly accepted an unavailable musl target" >&2
            exit 1
          fi
          grep -Fq "currently require glibc" <<<"${output}"

      - name: Pack dry run
        working-directory: npx-cli
        run: npm pack --dry-run
