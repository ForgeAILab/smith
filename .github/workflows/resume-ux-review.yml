name: Resume UX regression
on:
  push:
    branches: [fix/resume-upgrade-status-ux]
    paths: [.github/workflows/resume-ux-review.yml]
permissions:
  contents: write
jobs:
  regression:
    if: github.ref == 'refs/heads/fix/resume-upgrade-status-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply reviewed source patch
        shell: bash
        run: |
          cp .github/smith-resume-review.patch.gz.b64 review-payload.b64
          if [[ -f .github/smith-payload-repair.py ]]; then python3 .github/smith-payload-repair.py; fi
          base64 --decode .github/smith-resume-review.patch.gz.b64 | gzip --decompress > /tmp/smith-review.patch
          echo '52c9782f09ab8889aab23c10f7ae98569ad97f76d05652d1a21fcb06fd1ea9f8  /tmp/smith-review.patch' | sha256sum --check
          git apply --check /tmp/smith-review.patch
          git apply /tmp/smith-review.patch
          git add -N crates/smith-tui/src/time_display.rs docs/upgrade-recovery.md
          git diff --name-only -- '*.rs' > /tmp/review-rust-files
          xargs rustfmt --edition 2024 < /tmp/review-rust-files
          git add Cargo.toml Cargo.lock crates docs
          git rm .github/smith-resume-review.patch.gz.b64 .github/workflows/resume-ux-review.yml
          git rm --ignore-unmatch .github/smith-payload-repair.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep upgraded conversations resumable and simplify status output'
          git push origin HEAD:fix/resume-upgrade-status-ux
          git rev-parse HEAD > tested-revision.txt
          git diff 555d1cb4c95432db95fc626258c8a57908f7c82b HEAD -- Cargo.toml Cargo.lock crates docs > source.patch
          git archive --format=tar.gz HEAD > source.tar.gz
      - name: Install host link dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev libdbus-1-dev pkg-config
      - name: Test runtime host, terminal client and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p smith-runtime -p smith-tui -p smith-cli 2>&1 | tee smith-results.txt
      - name: Check formatting and clippy
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee formatting-results.txt
          cargo clippy --locked -p smith-runtime -p smith-tui -p smith-cli --all-targets 2>&1 | tee clippy-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-resume-ux-results
          path: |
            review-payload.b64
            smith-results.txt
            formatting-results.txt
            clippy-results.txt
            tested-revision.txt
            source.patch
            source.tar.gz
          retention-days: 3
