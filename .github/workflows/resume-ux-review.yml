name: Resume UX regression
on:
  push:
    branches: [fix/resume-upgrade-status-ux]
    paths: [.github/workflows/resume-ux-review.yml]
permissions:
  contents: write
jobs:
  regression:
    if: github.ref == 'refs/heads/fix/resume-upgrade-status-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the supported toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt && rustup default 1.88.0
      - name: Apply the status integration fix
        id: apply
        shell: bash
        run: |
          python3 .github/smith-ux-finalize.py
          rustfmt --edition 2024 crates/smith-cli/src/local_command.rs crates/smith-runtime/src/host.rs
          git add crates/smith-cli/src/local_command.rs crates/smith-runtime/src/host.rs
          git rm .github/smith-ux-finalize.py .github/workflows/resume-ux-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cli): render runtime maintenance status using its canonical type'
          git push origin HEAD:fix/resume-upgrade-status-ux
          git rev-parse HEAD > tested-revision.txt
          git diff 555d1cb4c95432db95fc626258c8a57908f7c82b HEAD -- Cargo.toml Cargo.lock crates docs > source.patch
          git archive --format=tar.gz HEAD > source.tar.gz
      - name: Install host link dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev libdbus-1-dev pkg-config
      - name: Test complete Smith workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee smith-results.txt
      - name: Check formatting and strict clippy
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee formatting-results.txt
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-resume-ux-results
          path: |
            smith-results.txt
            formatting-results.txt
            clippy-results.txt
            tested-revision.txt
            source.patch
            source.tar.gz
          retention-days: 3
