name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm publish provenance

jobs:
  build-native:
    name: Build native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS remains unchanged. GNU/Linux is an explicitly named
        # alternative built natively on Ubuntu 22.04, whose glibc 2.35
        # baseline also runs on Debian 12's glibc 2.36.
        include:
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 macOS image. GitHub drops Intel macOS entirely
          # when macOS 15 retires in autumn 2027.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: smith-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: smith-aarch64-macos
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: smith-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact: smith-aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build smith binary
        run: cargo build -p smith-cli --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/smith dist/
          cp LICENSE-MIT LICENSE-APACHE dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist smith LICENSE-MIT LICENSE-APACHE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  build-musl:
    name: Build portable ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    container:
      # Platform-specific digests from rust-cross/cargo-zigbuild's
      # sha-f36f2f2 image. A tag cannot move this release toolchain.
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: smith-x86_64-linux
            machine: "x86-64"
            image: ghcr.io/rust-cross/cargo-zigbuild@sha256:dfdbadd9b3c32cc5c8a8cba03fd990094e8b2162a75f27755469639760e9cae7
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: smith-aarch64-linux
            machine: "ARM aarch64"
            image: ghcr.io/rust-cross/cargo-zigbuild@sha256:8282f47dc8beff299275b02a8942cb7103918be89f644395ec9f6eafbeb1ea0c

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build and inspection tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            cmake \
            file \
            perl \
            pkg-config

      - name: Select the repository Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.88.0
          rustc --version
          cargo zigbuild --help >/dev/null
          echo "cargo-zigbuild=available"

      - name: Build static Smith binary
        env:
          CARGO_TARGET_DIR: target-musl
        run: cargo zigbuild --locked --release -p smith-cli --target ${{ matrix.target }}

      - name: Verify static artifact and keyring feature
        env:
          CARGO_TARGET_DIR: target-musl
        run: |
          binary="target-musl/${{ matrix.target }}/release/smith"
          test -x "${binary}"
          file "${binary}" | tee smith-file.txt
          grep -F "${{ matrix.machine }}" smith-file.txt
          grep -F "statically linked" smith-file.txt
          if readelf --program-headers "${binary}" | grep -q 'Requesting program interpreter'; then
            echo "portable binary unexpectedly declares a dynamic interpreter" >&2
            exit 1
          fi
          cargo tree --locked -p smith-cli --target ${{ matrix.target }} --invert keyring |
            grep -F 'keyring v'
          expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$("${binary}" --version)" = "smith ${expected_version}"

      - name: Package portable binary
        env:
          CARGO_TARGET_DIR: target-musl
        run: |
          mkdir -p dist
          cp "target-musl/${{ matrix.target }}/release/smith" dist/
          cp LICENSE-MIT LICENSE-APACHE dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist smith LICENSE-MIT LICENSE-APACHE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  smoke-musl:
    name: Smoke portable ${{ matrix.target }}
    needs: build-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: smith-x86_64-linux
            machine: "x86-64"
            container_smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: smith-aarch64-linux
            machine: "ARM aarch64"
            container_smoke: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download portable archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Inspect and execute on the native architecture
        run: |
          mkdir smoke
          tar -xzf ${{ matrix.artifact }}.tar.gz -C smoke
          test -x smoke/smith
          file smoke/smith | tee smith-file.txt
          grep -F "${{ matrix.machine }}" smith-file.txt
          grep -F "statically linked" smith-file.txt
          expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$(smoke/smith --version)" = "smith ${expected_version}"

      - name: Execute in clean Debian 12 and Alpine containers
        if: matrix.container_smoke
        run: |
          expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          expected="smith ${expected_version}"
          test "$(docker run --rm -v "${PWD}/smoke:/smith:ro" debian:12-slim /smith/smith --version)" = "${expected}"
          test "$(docker run --rm -v "${PWD}/smoke:/smith:ro" alpine:3.22 /smith/smith --version)" = "${expected}"

  release:
    name: Create Release
    needs: [build-native, smoke-musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          # download-artifact nests files as artifacts/<name>/<name>.tar.gz;
          # flatten so SHA256SUMS lists clean filenames that match what users
          # download from the release page.
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          test "$(find release-files -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = 6
          cd release-files && sha256sum *.tar.gz > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          # Same rule the npm dist-tag uses below: a hyphen in the version
          # means prerelease. Without this the action marks every tag a full
          # release, so an -rc lands on the repo page as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS

  # Publishes through npm trusted publishing: the registry trusts this exact
  # workflow by name, and the npm CLI exchanges the job's OIDC token for a
  # short-lived credential. There is no npm token to store, leak, or rotate --
  # which is also why `id-token: write` below is load-bearing rather than
  # decorative.
  publish-npm:
    name: Publish npm Bootstrapper
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; the npm that
      # ships with Node is what actually performs the OIDC exchange, so the
      # version below is a requirement, not a preference.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an npm that can mint OIDC credentials
        run: |
          npm --version
          node --version
          npm install --global npm@latest
          npm --version

      - name: Set package version from tag
        working-directory: npx-cli
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Include license texts in the npm package
        run: |
          {
            echo "Smith is licensed under either the MIT License or Apache License 2.0, at your option."
            echo
            cat LICENSE-MIT
            echo
            echo "---"
            echo
            cat LICENSE-APACHE
          } > npx-cli/LICENSE

      # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment on its own.
      # Provenance is generated automatically under trusted publishing, so
      # passing --provenance would be redundant.
      - name: Publish package
        working-directory: npx-cli
        run: |
          package_name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm; skipping publish."
            exit 0
          fi

          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            npm_tag=next
          fi
          npm publish --access public --tag "$npm_tag"
