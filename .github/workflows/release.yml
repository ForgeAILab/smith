name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm publish provenance

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS (Intel + Apple Silicon) and Linux glibc (x86_64 + ARM).
        # musl targets are deferred: the keyring crate's sync-secret-service
        # feature needs libdbus at build time, which is not trivially
        # cross-compilable for static musl. Add them once that is resolved.
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: smith-x86_64-macos
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: smith-aarch64-macos
            builder: cargo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smith-x86_64-linux
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smith-aarch64-linux
            builder: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Install Linux host dependencies
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu \
            pkg-config \
            libdbus-1-dev:arm64

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build smith binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: ${{ matrix.builder }} build -p smith-cli --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/smith dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist smith

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          # download-artifact nests files as artifacts/<name>/<name>.tar.gz;
          # flatten so SHA256SUMS lists clean filenames that match what users
          # download from the release page.
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          cd release-files && sha256sum *.tar.gz > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS

  publish-npm:
    name: Publish npm Bootstrapper
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set package version from tag
        working-directory: npx-cli
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish package
        working-directory: npx-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm; skipping publish."
            exit 0
          fi

          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            npm_tag=next
          fi
          npm publish --access public --provenance --tag "$npm_tag"
