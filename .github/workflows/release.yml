name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm publish provenance

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS (Intel + Apple Silicon) and Linux glibc (x86_64 + ARM).
        # musl targets are deferred: the keyring crate's sync-secret-service
        # feature needs libdbus at build time, which is not trivially
        # cross-compilable for static musl. Add them once that is resolved.
        include:
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 macOS image. GitHub drops Intel macOS entirely
          # when macOS 15 retires in autumn 2027.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: smith-x86_64-macos
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: smith-aarch64-macos
            builder: cargo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smith-x86_64-linux
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: smith-aarch64-linux
            builder: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Install Linux host dependencies
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Ubuntu's archive and security hosts carry amd64/i386 only; every
          # other architecture lives on ports.ubuntu.com. Enabling arm64
          # without repointing it there makes `apt-get update` 404 on the
          # arm64 indexes, and apt treats a missing index as fatal. Pin the
          # stock sources to the host architecture, then give arm64 a source
          # that actually carries it.
          . /etc/os-release
          if compgen -G "/etc/apt/sources.list.d/*.sources" > /dev/null; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/*.sources
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/*.sources
          fi
          for legacy in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [[ -f "${legacy}" ]] || continue
            sudo sed -i -E 's|^deb(-src)? +(\[[^]]*\] *)?|deb\1 [arch=amd64] |' "${legacy}"
          done
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports ${VERSION_CODENAME}-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libc6-dev-arm64-cross is only *recommended* by the cross gcc, so
          # --no-install-recommends drops it and leaves the compiler with no
          # target libc headers -- at which point it reaches for the host's
          # /usr/include and dies on bits/libc-header-start.h. Name it.
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libdbus-1-dev:arm64

          # Only this leg cross-compiles. Exporting the cross environment here
          # rather than on the shared build step is what keeps the native
          # x86_64 build from being pointed at an arm64 pkg-config path that
          # does not exist on its runner.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig"
          } >> "${GITHUB_ENV}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build smith binary
        run: ${{ matrix.builder }} build -p smith-cli --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/smith dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist smith

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          # download-artifact nests files as artifacts/<name>/<name>.tar.gz;
          # flatten so SHA256SUMS lists clean filenames that match what users
          # download from the release page.
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          cd release-files && sha256sum *.tar.gz > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Same rule the npm dist-tag uses below: a hyphen in the version
          # means prerelease. Without this the action marks every tag a full
          # release, so an -rc lands on the repo page as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS

  # Publishes through npm trusted publishing: the registry trusts this exact
  # workflow by name, and the npm CLI exchanges the job's OIDC token for a
  # short-lived credential. There is no npm token to store, leak, or rotate --
  # which is also why `id-token: write` below is load-bearing rather than
  # decorative.
  publish-npm:
    name: Publish npm Bootstrapper
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; the npm that
      # ships with Node is what actually performs the OIDC exchange, so the
      # version below is a requirement, not a preference.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm that can mint OIDC credentials
        run: |
          npm --version
          node --version
          npm install --global npm@latest
          npm --version

      - name: Set package version from tag
        working-directory: npx-cli
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment on its own.
      # Provenance is generated automatically under trusted publishing, so
      # passing --provenance would be redundant.
      - name: Publish package
        working-directory: npx-cli
        run: |
          package_name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm; skipping publish."
            exit 0
          fi

          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            npm_tag=next
          fi
          npm publish --access public --tag "$npm_tag"
