# Release dependency policy. Keep this list deliberately explicit: adding a
# new license or source should be a reviewed decision, not an incidental Cargo
# update.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared runtime is the one git source Smith builds against. Naming it
# here is also what keeps the name collision honest: `agent-runtime` on
# crates.io is an unrelated crate, so should the dependency ever resolve to
# the registry instead of this URL, `check sources` fails rather than
# building a stranger's code.
allow-git = ["https://github.com/ForgeAILab/agent-runtime.git"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
